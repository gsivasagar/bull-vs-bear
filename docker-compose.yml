services:
  backend:
    build: .
    ports:
      - "8000:8000"
    environment:
      # Browser origins allowed to call the API
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5173}
      - RATE_LIMIT_PER_MINUTE=${RATE_LIMIT_PER_MINUTE:-10}
      # Default: the Ollama running on your computer (used when no Gemini key is entered)
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-gemma3:latest}
    extra_hosts:
      # Lets Linux resolve host.docker.internal (harmless on Mac/Windows)
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    ports:
      - "5173:8080"
    depends_on:
      - backend
    restart: unless-stopped
