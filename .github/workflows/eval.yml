name: quant-evaluation

# Manual only: downloads 10 years of prices for 60 stocks from Yahoo, so it is slow and can be rate limited.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m scripts.eval_quant
      - uses: actions/upload-artifact@v4
        with:
          name: quant-evaluation-results
          path: eval/results/
